port = 8080
port = \${?$domain_name;format="upper"$_SERVICE_PORT}

metrics-port = 9090
metrics-port = \${?$domain_name;format="upper"$_SERVICE_METRICS_PORT}

service-name = "$domain_name$-service"
service-name = \${?$domain_name;format="upper"$_SERVICE_NAME}

# Directory holding the build-time generated AsyncAPI HTML (sbt plugin output).
# Overridable for Docker/local layouts - never read via sys.env in code.
async-api-html-dir = "target/asyncapi-docs"
async-api-html-dir = \${?ASYNCAPI_HTML_DIR}

postgres {
  host = "localhost"
  host = \${?POSTGRES_HOST}
  port = 5432
  port = \${?POSTGRES_PORT}
  database = "$domain_name$"
  database = \${?POSTGRES_DB}
  user = "$domain_name$"
  user = \${?POSTGRES_USER}
  password = "$domain_name$"
  password = \${?POSTGRES_PASSWORD}
}

# example-client is not read by the live service ($domain_name$-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}

# example-kafka-producer is not read by the live service ($domain_name$-service
# has no outbound Kafka publish call to make) - it exists only so
# KafkaProducerResilienceExampleSuite can demonstrate loading a purekafka
# ResilienceConfig via PureConfig, the same way a real producer's config would
# be loaded in Main. See docs/examples.md.
example-kafka-producer {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
