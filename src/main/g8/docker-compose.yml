services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: $domain_name$
      POSTGRES_USER: $domain_name$
      POSTGRES_PASSWORD: $domain_name$
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $domain_name$"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
